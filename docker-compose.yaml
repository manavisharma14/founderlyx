services:
  db:
    image: postgres:15
    container_name: omniflow-db
    restart: always
    environment:
      POSTGRES_USER: omniflow
      POSTGRES_PASSWORD: password
      POSTGRES_DB: omniflow
    ports:
      - "5432:5432"   
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: